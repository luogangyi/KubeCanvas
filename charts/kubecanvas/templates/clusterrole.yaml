{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubecanvas.fullname" . }}
  labels:
    {{- include "kubecanvas.labels" . | nindent 4 }}
rules:
  # Core API 资源
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Node 只用于为本地 PV 自动选择 Ready 节点
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  
  # Apps API 资源
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Batch API 资源
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Networking API 资源
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
