# ==================================
# KubeCanvas ConfigMap
# 用于覆盖默认配置
# ==================================
# 注意：以下配置会作为环境变量注入到容器中
# docker-entrypoint.sh 会读取这些环境变量
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecanvas-config
  namespace: default
  labels:
    app: kubecanvas
    app.kubernetes.io/name: kubecanvas
data:
  # ==================================
  # K8s API 配置 (可选，In-Cluster 模式下自动获取)
  # ==================================
  
  # K8s API Server 地址 (可选，Pod 内自动检测)
  # KUBERNETES_API_SERVER: "https://your-k8s-api-server:6443"
  
  # 认证 Token (可选，Pod 内使用 ServiceAccount Token)
  # KUBERNETES_TOKEN: "your-bearer-token-here"
  
  # 默认命名空间 (可选，默认使用 ServiceAccount 所在命名空间)
  KUBERNETES_NAMESPACE: "default"
  
  # ==================================
  # UI 配置
  # ==================================
  
  # 主题: light | dark (默认 light)
  UI_THEME: "light"
  
  # ==================================
  # 日志配置 (前端构建时固化，此处仅供参考)
  # ==================================
  
  # 日志级别: debug | info | warn | error
  # LOG_LEVEL: "info"
