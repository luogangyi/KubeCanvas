# ==================================
# Deployment
# ==================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecanvas
  namespace: default
  labels:
    app: kubecanvas
    app.kubernetes.io/name: kubecanvas
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecanvas
  template:
    metadata:
      labels:
        app: kubecanvas
    spec:
      serviceAccountName: kubecanvas
      
      containers:
        - name: kubecanvas
          # 请替换为你的镜像仓库地址
          image: kubecanvas:latest
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: false
