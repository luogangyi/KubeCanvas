server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA 路由 - 所有路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # K8s API 代理 (in-cluster 模式)
    # 注意: 需要 ServiceAccount 挂载
    location /k8s-api/ {
        # 从环境变量获取 token (通过 docker-entrypoint.sh 设置)
        set $k8s_token "";
        
        # 代理到 K8s API Server
        proxy_pass https://kubernetes.default.svc/;
        proxy_ssl_verify off;
        
        # 设置认证头
        proxy_set_header Authorization "Bearer $k8s_token";
        proxy_set_header Host kubernetes.default.svc;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
