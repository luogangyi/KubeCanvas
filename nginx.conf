server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA 路由 - 所有路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # K8s API 代理
    # 从环境变量或默认值获取配置
    # Docker 启动时通过 docker-entrypoint.sh 设置
    location /k8s-api/ {
        # 使用 resolver 支持动态 DNS (K8s 服务发现)
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;

        # 目标 K8s API Server
        # 默认使用 in-cluster 地址
        set $k8s_upstream "kubernetes.default.svc:443";
        
        # 代理配置
        proxy_pass https://$k8s_upstream/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        
        # 从请求头传递 Token (前端已设置 Authorization)
        proxy_pass_request_headers on;
        
        # 设置必要的头
        proxy_set_header Host kubernetes.default.svc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (watch API)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # Watch API 需要更长超时
        
        # 禁用缓冲以支持 streaming
        proxy_buffering off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
